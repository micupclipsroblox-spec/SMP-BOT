<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KoneSMP Bot Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07080c;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 235px;
    min-height: 100vh;
    background: #0d0f14;
    border-right: 1px solid #20242d;
    padding: 20px 14px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    padding: 10px 12px 28px;
}

.logo span {
    color: #6575ff;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.nav button {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 13px;
    background: transparent;
    color: #8e949f;
    text-align: left;
}

.nav button:hover,
.nav button.active {
    background: #191c24;
    color: white;
}

/* MAIN */

.main {
    margin-left: 235px;
    width: calc(100% - 235px);
    padding: 30px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title {
    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    color: #858b97;
    margin-top: 5px;
}

/* STATUS */

.status-box {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #969ba7;
}

.status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ef4658;
}

.status-dot.online {
    background: #35d98a;
    box-shadow: 0 0 13px #35d98a;
}

.status-dot.connecting {
    background: #e8b84c;
    box-shadow: 0 0 13px #e8b84c;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: #0e1016;
    border: 1px solid #20242d;
    border-radius: 12px;
    padding: 20px;
}

.card-label {
    color: #858b97;
    font-size: 13px;
    margin-bottom: 10px;
}

.card-value {
    font-size: 24px;
    font-weight: 800;
}

/* PANELS */

.panel {
    background: #0e1016;
    border: 1px solid #20242d;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
}

.panel-title {
    padding: 16px 20px;
    border-bottom: 1px solid #20242d;
    font-weight: 700;
}

.panel-content {
    padding: 20px;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: 1px solid #2a2e38;
    background: #171a21;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    transition: .15s;
}

.btn:hover {
    filter: brightness(1.18);
    transform: translateY(-1px);
}

.btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

.start {
    background: #168b58;
    border-color: #168b58;
}

.stop {
    background: #a92f40;
    border-color: #a92f40;
}

.restart {
    background: #515fd5;
    border-color: #515fd5;
}

/* CONSOLE */

.console {
    height: 430px;
    overflow-y: auto;
    padding: 16px;
    background: #06080b;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.log {
    color: #aeb4c0;
}

.log.success {
    color: #40db95;
}

.log.error {
    color: #ff6978;
}

.log.command {
    color: #8292ff;
}

.log.warn {
    color: #e9bb51;
}

/* COMMAND */

.command-row {
    display: flex;
    gap: 10px;
    padding: 12px 0 0;
}

.command-input {
    flex: 1;
    background: #080a0e;
    border: 1px solid #292e38;
    color: white;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.command-input:focus {
    border-color: #6676ec;
}

/* FORMS */

.form-row {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 12px;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    color: #9298a4;
    font-size: 13px;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    background: #080a0e;
    border: 1px solid #292e38;
    color: white;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.field input:focus {
    border-color: #6676ec;
}

/* CONNECTION */

.connection {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #969ba7;
}

.connection-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4658;
}

.connection-dot.connected {
    background: #35d98a;
}

/* MOBILE */

@media(max-width: 900px) {

    .sidebar {
        width: 65px;
        padding: 15px 7px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo span {
        font-size: 21px;
    }

    .nav button {
        font-size: 0;
        text-align: center;
    }

    .nav button::first-letter {
        font-size: 20px;
    }

    .main {
        margin-left: 65px;
        width: calc(100% - 65px);
        padding: 18px;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .header {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
    }
}
</style>
</head>
