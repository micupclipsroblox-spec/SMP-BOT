<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server Panel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090d;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 230px;
    background: #0d0f14;
    border-right: 1px solid #20232c;
    padding: 20px 14px;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    padding: 10px 12px 25px;
}

.logo span {
    color: #6878ff;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.nav button {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 13px;
    text-align: left;
    background: transparent;
    color: #969ba7;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    background: #191c24;
    color: white;
}

/* CONTENT */

.content {
    flex: 1;
    padding: 30px;
    max-width: 1500px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title {
    font-size: 29px;
    font-weight: 800;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #969ba7;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f04455;
}

.status-dot.online {
    background: #38d889;
    box-shadow: 0 0 12px #38d889;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: #0e1016;
    border: 1px solid #20232c;
    border-radius: 12px;
    padding: 20px;
}

.card-label {
    color: #858b98;
    font-size: 13px;
    margin-bottom: 10px;
}

.card-value {
    font-size: 24px;
    font-weight: 800;
}

/* CONTROLS */

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.control {
    border: 1px solid #292e39;
    background: #151820;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: .15s;
}

.control:hover {
    transform: translateY(-1px);
    filter: brightness(1.15);
}

.start {
    background: #168b58;
    border-color: #168b58;
}

.stop {
    background: #aa3040;
    border-color: #aa3040;
}

.restart {
    background: #505fd3;
    border-color: #505fd3;
}

/* PANELS */

.panel {
    background: #0e1016;
    border: 1px solid #20232c;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
}

.panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid #20232c;
    font-weight: 700;
}

.console {
    height: 430px;
    overflow-y: auto;
    padding: 17px;
    background: #07090d;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.log {
    color: #aeb4c0;
}

.log.success {
    color: #40d994;
}

.log.error {
    color: #ff6877;
}

.log.command {
    color: #7e90ff;
}

/* COMMAND */

.command-row {
    display: flex;
    gap: 10px;
}

.command-input {
    flex: 1;
    padding: 12px;
    background: #0e1016;
    border: 1px solid #292e39;
    color: white;
    border-radius: 8px;
    outline: none;
}

.command-input:focus {
    border-color: #6474e9;
}

/* SETTINGS */

.setting {
    padding: 20px;
}

.setting label {
    display: block;
    color: #969ba7;
    font-size: 13px;
    margin-bottom: 7px;
}

.setting input {
    width: 100%;
    max-width: 600px;
    background: #080a0e;
    border: 1px solid #292e39;
    color: white;
    padding: 12px;
    border-radius: 8px;
    outline: none;
    margin-bottom: 18px;
}

/* MOBILE */

@media(max-width: 850px) {
    .sidebar {
        width: 65px;
        padding: 15px 7px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo span {
        font-size: 21px;
    }

    .nav button {
        font-size: 0;
        text-align: center;
    }

    .nav button::first-letter {
        font-size: 20px;
    }

    .content {
        padding: 18px;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .controls {
        flex-wrap: wrap;
    }
}
</style>
</head>
